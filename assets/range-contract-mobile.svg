<svg xmlns="http://www.w3.org/2000/svg" width="600" height="410" viewBox="0 0 600 410" role="img" aria-labelledby="title desc"><title id="title">React DateTime Range Picker</title><desc id="desc">Controlled value: startTimestamp and endTimestamp are epoch milliseconds or null. onChange reports draft edits. onCommit accepts a complete range when Apply is used. The range follows [start, end) semantics.</desc><rect width="600" height="410" rx="4" fill="#24272B"/><text x="28" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#F0E9DE">DateTime range contract</text><rect x="24" y="77" width="552" height="104" rx="4" fill="#1D2024"/><text x="40" y="119" font-family="Consolas, monospace" font-size="25" font-weight="400" fill="#F0E9DE">startTimestamp: number | null</text><text x="40" y="157" font-family="Consolas, monospace" font-size="25" font-weight="400" fill="#F0E9DE">endTimestamp: number | null</text><text x="30" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="600" fill="#C89970">onChange</text><text x="220" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" fill="#F0E9DE">Draft edits</text><text x="30" y="278" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="600" fill="#C89970">onCommit</text><text x="220" y="278" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" fill="#F0E9DE">Apply a valid range</text><text x="30" y="337" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#AEB6BD">Epoch milliseconds. IANA display timezone.</text><text x="30" y="378" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#AEB6BD">Range semantics: [start, end)</text></svg>
