  <text x="36" y="96" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#91a8c6">Clear boundaries, measurable performance, stable public APIs.</text>

  <path d="M120 164 H880" stroke="url(#flow)" stroke-width="3" filter="url(#glow)" opacity=".9"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">
