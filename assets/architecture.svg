<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071322"/>
      <stop offset="100%" stop-color="#131831"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="330" rx="24" fill="url(#bg)" stroke="#283a59"/>
  <text x="40" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="800" fill="#93c5fd" letter-spacing="2">SYSTEM FLOW</text>
  <text x="40" y="86" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="800" fill="#f7fbff">Data-heavy product architecture</text>

  <path d="M122 172H878" stroke="url(#flow)" stroke-width="5" stroke-linecap="round" opacity=".82"/>

  <!-- Data -->
  <g transform="translate(62 125)">
    <circle cx="60" cy="47" r="48" fill="#0a2333" stroke="#22d3ee" stroke-opacity=".62"/>
    <path d="M41 38h38M41 49h38M41 60h26" stroke="#67e8f9" stroke-width="4" stroke-linecap="round"/>
    <text x="60" y="121" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" fill="#e6fbff">Data</text>
  </g>

  <!-- Query -->
  <g transform="translate(251 125)">
    <circle cx="60" cy="47" r="48" fill="#0d2038" stroke="#4f8fd7" stroke-opacity=".65"/>
    <ellipse cx="60" cy="35" rx="21" ry="8" fill="none" stroke="#93c5fd" stroke-width="4"/>
    <path d="M39 35v28c0 5 9 9 21 9s21-4 21-9V35M39 49c0 5 9 9 21 9s21-4 21-9" fill="none" stroke="#93c5fd" stroke-width="4"/>
    <text x="60" y="121" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" fill="#eef6ff">Query</text>
  </g>

  <!-- Core -->
  <g transform="translate(440 125)">
    <circle cx="60" cy="47" r="48" fill="#111d39" stroke="#6681c9" stroke-opacity=".66"/>
    <circle cx="60" cy="47" r="18" fill="none" stroke="#b7c6ff" stroke-width="4"/>
    <path d="M60 21v10M60 63v10M34 47h10M76 47h10M42 29l7 7M71 58l7 7M78 29l-7 7M49 58l-7 7" stroke="#b7c6ff" stroke-width="4" stroke-linecap="round"/>
    <text x="60" y="121" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" fill="#f2f5ff">Core</text>
  </g>

  <!-- Canvas -->
  <g transform="translate(629 125)">
    <circle cx="60" cy="47" r="48" fill="#171a38" stroke="#7b68c5" stroke-opacity=".68"/>
    <rect x="36" y="28" width="48" height="38" rx="5" fill="none" stroke="#c4b5fd" stroke-width="4"/>
    <path d="M42 58l11-12 9 8 10-14 7 18" fill="none" stroke="#c4b5fd" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="121" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" fill="#f8f3ff">Canvas</text>
  </g>

  <!-- UI -->
  <g transform="translate(818 125)">
    <circle cx="60" cy="47" r="48" fill="#211a40" stroke="#a78bfa" stroke-opacity=".7"/>
    <rect x="36" y="29" width="48" height="34" rx="4" fill="none" stroke="#ddd6fe" stroke-width="4"/>
    <path d="M49 72h22M60 63v9" stroke="#ddd6fe" stroke-width="4" stroke-linecap="round"/>
    <text x="60" y="121" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" fill="#fbf8ff">UI</text>
  </g>

  <g font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="20">
    <rect x="92" y="279" width="228" height="34" rx="17" fill="#0b2738" stroke="#22d3ee" stroke-opacity=".45"/>
    <text x="206" y="302" text-anchor="middle" fill="#c9f8ff">1M–10M points</text>

    <rect x="386" y="279" width="228" height="34" rx="17" fill="#14213b" stroke="#60a5fa" stroke-opacity=".45"/>
    <text x="500" y="302" text-anchor="middle" fill="#dcecff">≤ 200ms target</text>

    <rect x="680" y="279" width="228" height="34" rx="17" fill="#211c3f" stroke="#a78bfa" stroke-opacity=".5"/>
    <text x="794" y="302" text-anchor="middle" fill="#eee8ff">Stable APIs</text>
  </g>
