<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="254" viewBox="0 0 1000 254" role="img" aria-labelledby="title desc"><title id="title">React DateTime Range Picker</title><desc id="desc">Controlled value: startTimestamp and endTimestamp are epoch milliseconds or null. onChange reports draft edits. onCommit accepts a complete range when Apply is used. The range follows [start, end) semantics.</desc><rect width="1000" height="254" rx="4" fill="#24272B"/><text x="36" y="49" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#F0E9DE">DateTime range contract</text><rect x="32" y="76" width="525" height="108" rx="4" fill="#1D2024"/><text x="49" y="120" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#F0E9DE">startTimestamp: number | null</text><text x="49" y="161" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#F0E9DE">endTimestamp: number | null</text><text x="597" y="113" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="600" fill="#C89970">onChange</text><text x="762" y="113" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" fill="#F0E9DE">Draft edits</text><text x="597" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="600" fill="#C89970">onCommit</text><text x="762" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" fill="#F0E9DE">Apply a valid range</text><text x="36" y="225" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#AEB6BD">Epoch milliseconds. IANA display timezone. Half-open [start, end) ranges.</text></svg>
