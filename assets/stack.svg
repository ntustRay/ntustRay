    <text x="24" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="650" fill="#c0bad9">Vitest · Playwright</text>
    <text x="24" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="650" fill="#c0bad9">Storybook · CI/CD</text>
