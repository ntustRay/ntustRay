<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111f"/>
      <stop offset="55%" stop-color="#0b1830"/>
      <stop offset="100%" stop-color="#17173a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="52%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow1" cx="18%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="88%" cy="62%" r="44%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity=".19"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#a8bdd8" stroke-opacity=".05"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="28" fill="url(#glow1)"/>
  <rect width="1200" height="360" rx="28" fill="url(#glow2)"/>

  <rect x="58" y="44" width="258" height="42" rx="21" fill="#0b2939" stroke="#22d3ee" stroke-opacity=".6"/>
  <text x="187" y="71" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="800" fill="#7be8f7" letter-spacing="1.5">FULL-STACK ENGINEER</text>

  <text x="58" y="174" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="92" font-weight="850" fill="#f8fbff" letter-spacing="-3">MingRay</text>
  <rect x="58" y="193" width="410" height="6" rx="3" fill="url(#accent)"/>

  <text x="58" y="244" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="31" font-weight="760" fill="#e4eefc">Builds data-heavy web products.</text>
  <text x="58" y="282" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="650" fill="#9fb4cf">React · TypeScript · Next.js · Node.js · DuckDB</text>

  <!-- UI icon -->
  <g transform="translate(770 76)">
    <rect width="112" height="112" rx="28" fill="#0a2334" stroke="#22d3ee" stroke-opacity=".55"/>
    <rect x="27" y="29" width="58" height="42" rx="5" fill="none" stroke="#67e8f9" stroke-width="4"/>
    <path d="M49 83h14M56 71v12" stroke="#67e8f9" stroke-width="4" stroke-linecap="round"/>
    <text x="56" y="103" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="800" fill="#dffcff">UI</text>
  </g>

  <!-- API icon -->
  <g transform="translate(910 76)">
    <rect width="112" height="112" rx="28" fill="#101e39" stroke="#60a5fa" stroke-opacity=".55"/>
    <path d="M34 43h44M34 56h44M34 69h28" stroke="#93c5fd" stroke-width="4" stroke-linecap="round"/>
    <circle cx="79" cy="69" r="6" fill="none" stroke="#93c5fd" stroke-width="4"/>
    <text x="56" y="103" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="800" fill="#e5efff">API</text>
  </g>

  <!-- data icon -->
  <g transform="translate(1050 76)">
    <rect width="112" height="112" rx="28" fill="#1a1939" stroke="#a78bfa" stroke-opacity=".58"/>
    <ellipse cx="56" cy="38" rx="26" ry="10" fill="none" stroke="#c4b5fd" stroke-width="4"/>
    <path d="M30 38v34c0 6 12 11 26 11s26-5 26-11V38M30 55c0 6 12 11 26 11s26-5 26-11" fill="none" stroke="#c4b5fd" stroke-width="4"/>
    <text x="56" y="103" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="800" fill="#f0eaff">DATA</text>
  </g>

  <text x="770" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" fill="#8ea7c7">PERFORMANCE</text>
  <text x="770" y="250" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="780" fill="#f5f8ff">Visualization at scale</text>
  <path d="M770 316 C830 296 875 326 932 307 S1048 278 1142 288" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="770" cy="316" r="6" fill="#22d3ee"/>
  <circle cx="932" cy="307" r="6" fill="#60a5fa"/>
  <circle cx="1142" cy="288" r="6" fill="#a78bfa"/>
</svg>